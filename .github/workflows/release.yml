name: Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Build and verify release
        run: |
          try {
            & ./scripts/build-release.ps1 *>&1 | Tee-Object -File release-build.log
          } catch {
            $lines = if (Test-Path release-build.log) { Get-Content release-build.log -Tail 80 } else { @() }
            $detail = ($lines -join "`n") + "`n" + ($_ | Out-String)
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows release build failed::$detail"
            exit 1
          }
      - name: Publish versioned downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content app_update.go -Raw), 'var appVersion = "([0-9.]+)"').Groups[1].Value
          if (-not $version) { throw 'Missing app version' }
          $tag = "v$version"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; bump appVersion before publishing new binaries" }
          gh release create $tag "build/bin/WindowsSystemRepairHelper.exe" "build/bin/windows-system-repair-helper-$version.zip" --target $env:GITHUB_SHA --title $tag --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
